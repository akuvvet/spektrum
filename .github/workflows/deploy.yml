name: Auf den Server übertragen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probelauf:
        description: "Probelauf — zeigt nur, was übertragen und was gelöscht würde, ändert nichts"
        type: boolean
        default: true
      projekte_html:
        description: "projekte.html mit überschreiben (danach im Adminbereich »Seite neu schreiben« klicken)"
        type: boolean
        default: false

concurrency:
  group: deploy-produktion
  cancel-in-progress: false

jobs:
  uebertragen:
    name: rsync nach httpdocs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Stand auschecken
        uses: actions/checkout@v4

      - name: Tresor prüfen
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ZIEL: ${{ secrets.ZIEL_PFAD }}
        run: |
          set -uo pipefail
          fehlt=0
          pruefe () {
            if [ -z "$2" ]; then
              echo "  FEHLT    $1"
              fehlt=1
            else
              echo "  gesetzt  $1"
            fi
          }
          echo "Was im Tresor liegt:"
          pruefe SSH_HOST        "${SSH_HOST:-}"
          pruefe SSH_USER        "${SSH_USER:-}"
          pruefe ZIEL_PFAD       "${ZIEL:-}"
          pruefe SSH_KEY         "${SSH_KEY:-}"

          if [ -n "${SSH_KEY:-}" ]; then
            case "$SSH_KEY" in
              *"BEGIN "*"PRIVATE KEY"*) : ;;
              *) echo "::warning::SSH_KEY beginnt nicht mit -----BEGIN … PRIVATE KEY-----. Wurde versehentlich die .pub-Datei eingefügt?" ;;
            esac
          fi

          if [ "$fehlt" = "1" ]; then
            echo "::error::Es fehlen Secrets — siehe Liste oben. Anzulegen unter Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

      - name: SSH vorbereiten
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          
          # Holt den Host Key bei jedem Lauf automatisch und verhindert Mismatches
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Verbindung prüfen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          ZIEL: ${{ secrets.ZIEL_PFAD }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=no \
              "$SSH_USER@$SSH_HOST" \
              "test -d '$ZIEL' || { echo 'Zielordner fehlt: $ZIEL'; exit 1; }; \
               command -v rsync >/dev/null || { echo 'Auf dem Server fehlt rsync.'; exit 1; }; \
               test -w '$ZIEL' || { echo 'Kein Schreibrecht auf $ZIEL'; exit 1; }; \
               echo \"Zielordner in Ordnung: \$(stat -c '%U:%G %a' '$ZIEL') \$ZIEL\""

      - name: Dateien übertragen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          ZIEL: ${{ secrets.ZIEL_PFAD }}
          PROJEKTE_HTML: ${{ inputs.projekte_html }}
          PROBELAUF: ${{ inputs.probelauf }}
        run: |
          set -euo pipefail

          TROCKEN=()
          if [ "${PROBELAUF:-false}" = "true" ]; then
            TROCKEN=( --dry-run )
            echo "::notice::PROBELAUF — es wird nichts verändert."
          fi

          AUSNAHMEN=(
            --exclude '.git/'
            --exclude '.github/'
            --exclude '.gitignore'
            --exclude '.gitattributes'
            --exclude '*.md'
            --exclude '*.tar.gz'
            --exclude '*.zip'
            --exclude 'daten/'
            --exclude 'assets/projekte/'
            --exclude '.well-known/'
          )

          if [ "${PROJEKTE_HTML:-false}" = "true" ]; then
            echo "projekte.html wird mit übertragen."
          else
            AUSNAHMEN+=( --exclude 'projekte.html' )
          fi

          rsync -rlz --delete --chmod=D755,F644 --omit-dir-times \
            --itemize-changes "${TROCKEN[@]}" \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT:-22} -o BatchMode=yes -o StrictHostKeyChecking=no" \
            "${AUSNAHMEN[@]}" \
            ./ "$SSH_USER@$SSH_HOST:$ZIEL/"

      - name: Ergebnis prüfen
        if: ${{ inputs.probelauf != 'true' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          ZIEL: ${{ secrets.ZIEL_PFAD }}
          PROJEKTE_HTML: ${{ inputs.projekte_html }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=no \
              "$SSH_USER@$SSH_HOST" \
              "stat -c '%n  %U:%G  %a' '$ZIEL/index.html' '$ZIEL/admin/kern.php' '$ZIEL/assets/styles.css'" \
            | tee /tmp/rechte.txt || true

          {
            echo "### Übertragen nach \`$ZIEL\`"
            echo ""
            echo '```'
            cat /tmp/rechte.txt || echo "Rechte konnten nicht ausgelesen werden."
            echo '```'
            if [ "${PROJEKTE_HTML:-false}" = "true" ]; then
              echo ""
              echo "⚠️ **projekte.html wurde überschrieben.** Jetzt im Adminbereich einmal auf **Seite neu schreiben** klicken, sonst stehen dort die acht Startprojekte."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Aufräumen
        if: always()
        run: rm -f ~/.ssh/id_deploy
